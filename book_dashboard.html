<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblia-Style Book Tracker</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Html5-Qrcode Library (CDN) -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Supabase JS Client (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #050506;
            --panel-bg: #111115;
            --card-bg: #181820;
            --card-hover-bg: #22222d;
            --border-color: #262630;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-color: #00f0ff;
            --accent-hover: #00c8d6;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --success-color: #10b981;
            --font-outfit: 'Outfit', 'Inter', 'Noto Sans JP', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-outfit);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* Loading Spinner */
        #global-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 6, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #global-loader.active {
            opacity: 1;
            pointer-events: auto;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* App Container */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 16px;
            flex: 1;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .logo-area h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-area h1 span {
            color: var(--accent-color);
        }

        .logo-area p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .header-buttons {
            display: flex;
            gap: 12px;
        }

        /* Base Buttons */
        .btn {
            background-color: var(--panel-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: var(--card-hover-bg);
            border-color: var(--text-secondary);
        }

        .btn-accent {
            background-color: var(--accent-color);
            color: #050506;
            border-color: var(--accent-color);
            font-weight: 600;
        }

        .btn-accent:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
            color: #050506;
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        .btn-danger:hover {
            background-color: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        /* Accordion Settings Panel */
        .settings-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 24px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .settings-toggle {
            width: 100%;
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 16px;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .settings-toggle:hover {
            color: var(--text-primary);
        }

        .settings-toggle::after {
            content: '▼';
            font-size: 0.75rem;
            transition: transform 0.3s ease;
        }

        .settings-panel.open .settings-toggle::after {
            transform: rotate(180deg);
        }

        .settings-content {
            padding: 0 16px 16px 16px;
            display: none;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .settings-panel.open .settings-content {
            display: block;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input, .form-group select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .settings-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 12px;
        }

        /* Filter Controls */
        .controls-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-input-wrapper {
            flex: 1;
            min-width: 260px;
            position: relative;
        }

        .search-input-wrapper input {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 12px 10px 36px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
        }

        .search-input-wrapper input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .search-input-wrapper::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .sort-select {
            min-width: 180px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
        }

        /* Tags Row */
        .tags-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .tags-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-right: 8px;
        }

        .tag-badge {
            background-color: var(--bg-color);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-badge:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .tag-badge.active {
            background-color: rgba(0, 240, 255, 0.1);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* 5-Column Grid */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        @media (max-width: 1024px) {
            .books-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
            }
        }

        @media (max-width: 768px) {
            .books-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            .books-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }

        /* Book Card */
        .book-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, background-color 0.25s ease;
            position: relative;
        }

        .book-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-color);
            background-color: var(--card-hover-bg);
        }

        .cover-area {
            position: relative;
            width: 100%;
            padding-top: 145%; /* Aspect Ratio ~ 1:1.45 */
            background-color: #0d0d11;
            border-bottom: 1px solid var(--border-color);
            overflow: hidden;
        }

        .cover-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .book-card:hover .cover-img {
            transform: scale(1.03);
        }

        /* Custom Placeholder Style (No Image) */
        .cover-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12px;
            text-align: center;
            background: linear-gradient(135deg, #16161a 0%, #0d0d10 100%);
            color: var(--text-secondary);
            font-family: inherit;
        }

        .cover-placeholder-icon {
            font-size: 2rem;
            margin-bottom: 8px;
            opacity: 0.4;
        }

        .cover-placeholder-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
            max-width: 90%;
            margin-top: 4px;
        }

        .cover-placeholder-author {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 90%;
        }

        .card-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .card-author {
            font-size: 0.75rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 8px;
        }

        /* Clickable author link on card */
        .card-author-link {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .card-author-link:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .status-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .status-badge.stock {
            background-color: rgba(243, 244, 246, 0.1);
            color: var(--text-secondary);
        }

        .status-badge.read {
            background-color: rgba(0, 240, 255, 0.15);
            color: var(--accent-color);
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        .card-date {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            padding: 64px 16px;
            text-align: center;
            background-color: var(--panel-bg);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Modal Structure */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 16px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* ISBN / Keyword input row */
        .isbn-search-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .isbn-search-row .form-group {
            flex: 1;
        }

        /* Keyword Candidates Container */
        .candidates-container {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 240px;
            overflow-y: auto;
            background-color: var(--bg-color);
            display: none;
            flex-direction: column;
        }

        .search-result-item {
            display: flex;
            gap: 12px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.2s ease;
            align-items: center;
        }

        .search-result-item:hover {
            background-color: var(--card-hover-bg);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .result-thumb {
            width: 36px;
            height: 52px;
            object-fit: cover;
            background-color: #0d0d11;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .result-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .result-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-author {
            font-size: 0.7rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Camera Scanner Styles */
        .scanner-container {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            display: none;
            flex-direction: column;
            position: relative;
        }

        .scanner-container.active {
            display: flex;
        }

        #reader {
            width: 100%;
            max-width: 100%;
        }

        .scanner-controls {
            padding: 10px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
        }

        /* Checkbox Switch styling */
        .switch-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .switch-label {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .switch-control {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch-control input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--border-color);
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-color);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
            background-color: #050506;
        }

        /* Detail Modal Specifics */
        .detail-cover-showcase {
            width: 140px;
            height: 200px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            align-self: center;
            background-color: #0d0d11;
            margin-bottom: 8px;
            position: relative;
        }

        .detail-cover-showcase img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detail-cover-showcase .cover-placeholder {
            border-radius: 8px;
        }

        /* Stats Chart Panel */
        .stats-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }

        .stats-panel:not(.open) {
            padding: 12px 20px;
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-panel.open .stats-header {
            margin-bottom: 16px;
        }

        .stats-panel:not(.open) .stats-header {
            margin-bottom: 0;
        }

        .stats-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-summary {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .stats-toggle {
            display: none;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .stats-panel.open .stats-toggle {
            display: flex;
        }

        .stats-panel.open #stats-chevron {
            transform: rotate(180deg);
        }

        .stats-toggle-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .stats-toggle-btn.active {
            background-color: var(--accent-color);
            color: #050506;
        }

        .stats-toggle-btn:hover:not(.active) {
            color: var(--text-primary);
            background-color: var(--card-hover-bg);
        }

        .stats-content {
            display: none;
        }

        .stats-panel.open .stats-content {
            display: block;
        }

        .chart-wrapper {
            position: relative;
            height: 200px;
        }

        .stats-empty {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Rating Stars */
        .rating-input {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 1.5rem;
            user-select: none;
        }

        .rating-input .star {
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.15s ease, transform 0.1s ease;
        }

        .rating-input .star:hover {
            transform: scale(1.2);
        }

        .rating-input .star.active {
            color: #ffd700; /* ゴールド */
        }
        
        .btn-clear-rating {
            background-color: var(--card-hover-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-clear-rating:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);

    <script>

        const GOOGLE_BOOKS_API_KEY = 'AIzaSyB53pcT8_hIYw7E0Di7gIoEVjziqk68x_0';

        // --- DOM Elements ---
        const booksGrid = document.getElementById('books-grid');
        const searchInput = document.getElementById('search-input');

        // Modals & Controls

        // --- Toast Utility ---
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');

        // --- Loading Spinner Control ---
        function setLoader(active, text = '処理中...') {
            loaderText.textContent = text;
            if (active) {
                loader.classList.add('active');
            } else {
                loader.classList.remove('active');

        // --- Helper: Date Formatter (Local YYYY-MM-DD) ---
        function getLocalDateString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // --- Local Storage Handling ---
        function loadLocalStorage() {
            // Load Books
            const localBooks = localStorage.getItem('biblia_books');
            if (localBooks) {
                try {
                    books = JSON.parse(localBooks);
                } catch (e) {
                    console.error("Local data parsing error, resetting.", e);
                    books = [];
                }
            }

            // Load Settings
            const savedUrl = localStorage.getItem('biblia_gas_url');
            const savedPassword = localStorage.getItem('biblia_gas_password');
            if (savedUrl) {
                syncSettings.url = savedUrl;
                document.getElementById('gas-url').value = savedUrl;
            }
            if (savedPassword) {
                syncSettings.password = savedPassword;
                document.getElementById('gas-password').value = savedPassword;
            }

            updateSyncStatus();
        }

        // Save local data helper
        function saveLocalData() {
            localStorage.setItem('biblia_books', JSON.stringify(books));
        }

        // Update status text helper
        function updateSyncStatus() {
            if (syncSettings.url) {
                syncStatusText.textContent = 'Supabase リアルタイム同期モード';
            } else {
                syncStatusText.textContent = 'ローカル保存モード (同期なし)';
            }
        }

        // --- HTTPS URL Auto Correction & Fallback ---
        function cleanImageUrl(url) {
            if (!url) return '';
            let cleanUrl = url.trim();
            // Google Books HTTP link correction
            if (cleanUrl.startsWith('http://')) {
                cleanUrl = cleanUrl.replace('http://', 'https://');
            }
            return cleanUrl;
        }

        // --- ISBN Query Logic ---
        async function lookupISBN(isbn) {
            const sanitizedIsbn = isbn.replace(/[-\s]/g, '').trim();
            if (!sanitizedIsbn) return null;

            // 1. Try openBD API
            try {
                const response = await fetch(`https://api.openbd.jp/v1/get?isbn=${sanitizedIsbn}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data[0] && data[0].summary) {
                        const summary = data[0].summary;
                        return {
                            title: summary.title || '',
                            author: summary.author || '',
                            cover: cleanImageUrl(summary.cover) || '',
                            genre: ''
                        };
                    }
                }
            } catch (e) {
                console.warn("openBD look up failed, falling back to Google Books.", e);
            }

            // 2. Try Google Books API
            try {
                const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${sanitizedIsbn}&key=${GOOGLE_BOOKS_API_KEY}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.items && data.items[0]) {
                        const info = data.items[0].volumeInfo;
                        let cover = '';
                        if (info.imageLinks) {
                            cover = info.imageLinks.thumbnail || info.imageLinks.smallThumbnail || '';
                        }
                        return {
                            title: info.title || '',
                            author: info.authors ? info.authors.join(', ') : '',
                            cover: cleanImageUrl(cover),
                            genre: info.categories ? info.categories.join(', ') : ''
                        };
                    }
                }
            } catch (e) {
                console.error("Google Books look up failed.", e);
            }

            return null;
        }

        // --- Google Books Keyword Search (All results pagination support) ---
        async function triggerKeywordSearch(keyword, isAppend = false) {
            const trimmedKeyword = keyword.trim();
            if (!trimmedKeyword) return;

            if (!isAppend) {
                currentStartIndex = 0;
                currentKeyword = trimmedKeyword;
                searchCandidatesList.innerHTML = '';
                searchCandidatesContainer.style.display = 'flex';
                loadMoreCandidatesBtn.style.display = 'none';
            }

            setLoader(true, "書籍を検索中...");
            try {
                // Encode space-separated words to support Google Books AND search query parameter
                const q = encodeURIComponent(currentKeyword);
                const url = `https://www.googleapis.com/books/v1/volumes?q=${q}&key=${GOOGLE_BOOKS_API_KEY}&startIndex=${currentStartIndex}&maxResults=${maxResultsPerPage}`;
                
                const response = await fetch(url);
                if (response.ok) {
                    const data = await response.json();
                    if (data.items && data.items.length > 0) {
                        renderCandidates(data.items);
                        currentStartIndex += data.items.length;
                        
                        // Display 'load more' button if matched result length matches requesting maxResult length
                        if (data.items.length < maxResultsPerPage) {
                            loadMoreCandidatesBtn.style.display = 'none';
                        } else {
                            loadMoreCandidatesBtn.style.display = 'inline-flex';
                        }
                    } else {
                        if (!isAppend) {
                            searchCandidatesList.innerHTML = '<div style="padding: 16px; text-align:center; color: var(--text-secondary); font-size: 0.85rem;">該当する書籍が見つかりませんでした。</div>';
                            loadMoreCandidatesBtn.style.display = 'none';
                        } else {
                            showToast("これ以上の検索結果はありません");
                            loadMoreCandidatesBtn.style.display = 'none';
                        }
                    }
                } else {
                    showToast("検索結果の取得に失敗しました", 'error');
                }
            } catch (e) {
                console.error("Keyword search failed", e);
                showToast("接続エラーが発生しました", 'error');
            }
            setLoader(false);
        }

        function renderCandidates(items) {
            items.forEach(item => {
                const info = item.volumeInfo;
                let cover = '';
                if (info.imageLinks) {
                    cover = info.imageLinks.thumbnail || info.imageLinks.smallThumbnail || '';
                }
                cover = cleanImageUrl(cover);
                
                const title = info.title || 'タイトル不明';
                const author = info.authors ? info.authors.join(', ') : '著者不明';
                const publisher = info.publisher || '';
                const genres = info.categories ? info.categories.join(', ') : '';
                
                // Try retrieving ISBN
                let isbn = '';
                if (info.industryIdentifiers) {
                    const isbn13 = info.industryIdentifiers.find(id => id.type === 'ISBN_13');
                    const isbn10 = info.industryIdentifiers.find(id => id.type === 'ISBN_10');
                    isbn = isbn13 ? isbn13.identifier : (isbn10 ? isbn10.identifier : '');
                }

                const itemEl = document.createElement('div');
                itemEl.className = 'search-result-item';
                
                const imgHtml = cover 
                    ? `<img src="${cover}" class="result-thumb" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="result-thumb" style="display:none; justify-content:center; align-items:center; font-size:1rem; background-color:#2a2a2a; border-radius:4px;">📖</div>` 
                    : `<div class="result-thumb" style="display:flex; justify-content:center; align-items:center; font-size:1rem; background-color:#2a2a2a; border-radius:4px;">📖</div>`;

                itemEl.innerHTML = `
                    ${imgHtml}
                    <div class="result-info">
                        <div class="result-title" title="${title}">${title}</div>
                        <div class="result-author" title="${author}">${author}</div>
                    </div>
                `;
                
                itemEl.addEventListener('click', () => {
                    // Populate inputs
                    bookTitle.value = title;
                    bookAuthor.value = author;
                    bookCover.value = cover;
                    bookGenre.value = genres;
                    isbnInput.value = isbn;
                    
                    // Clear list and close
                    searchCandidatesContainer.style.display = 'none';
                    searchCandidatesList.innerHTML = '';
                    showToast("書籍情報をフォームに入力しました");
                });

                searchCandidatesList.appendChild(itemEl);
            });
        }

        // --- Camera Barcode Scanning ---
        function startCameraScan() {
            const scannerContainer = document.getElementById('scanner-container');
            scannerContainer.classList.add('active');

            if (!html5Qrcode) {
                html5Qrcode = new Html5Qrcode("reader");
            }

            const config = {
                fps: 10,
                qrbox: { width: 280, height: 160 },
                aspectRatio: 1.777778
            };

            html5Qrcode.start(
                { facingMode: "environment" },
                config,
                async (decodedText, decodedResult) => {
                    if (navigator.vibrate) navigator.vibrate(100);
                    showToast("バーコードを読み取りました", 'success');
                    isbnInput.value = decodedText;
                    stopCameraScan();
                    
                    await handleISBNSearch(decodedText);
                },
                (errorMessage) => {}
            ).catch(err => {
                console.error("Camera access failed", err);
                showToast("カメラ起動エラー: カメラ使用許可を確認してください", 'error');
                stopCameraScan();
            });
        }

        function stopCameraScan() {
            const scannerContainer = document.getElementById('scanner-container');
            scannerContainer.classList.remove('active');
            if (html5Qrcode && html5Qrcode.isScanning) {
                html5Qrcode.stop().catch(err => console.error("Error stopping camera", err));
            }
        }

        async function handleISBNSearch(isbn) {
            setLoader(true, "書籍情報を検索中...");
            const bookInfo = await lookupISBN(isbn);
            setLoader(false);

            if (bookInfo) {
                bookTitle.value = bookInfo.title;
                bookAuthor.value = bookInfo.author;
                bookCover.value = bookInfo.cover;
                bookGenre.value = bookInfo.genre;
                showToast("書籍情報を自動入力しました", 'success');
            } else {
                showToast("書籍情報が見つかりませんでした。手動入力してください。", 'error');
            }
        }

        // --- Rendering shelf (Books & Tags) ---
        function extractGenreTags() {
            const genreSet = new Set();
            books.forEach(b => {
                if (b.genre) {
                    b.genre.split(/[,，、/]/).forEach(g => {
                        const trimmed = g.trim();
                        if (trimmed) genreSet.add(trimmed);
                    });
                }
            });
            return Array.from(genreSet);
        }

        function renderGenreTags() {
            const activeGenre = activeFilters.genre;
            genreTagsContainer.innerHTML = '<span class="tags-label">ジャンル:</span>';
            
            // "All" badge
            const allBadge = document.createElement('span');
            allBadge.className = `tag-badge ${activeGenre === 'all' ? 'active' : ''}`;
            allBadge.textContent = 'すべて';
            allBadge.addEventListener('click', () => filterByGenre('all'));
            genreTagsContainer.appendChild(allBadge);

            const genres = extractGenreTags();
            genres.forEach(g => {
                const badge = document.createElement('span');
                badge.className = `tag-badge ${activeGenre === g ? 'active' : ''}`;
                badge.textContent = g;
                badge.addEventListener('click', () => filterByGenre(g));
                genreTagsContainer.appendChild(badge);
            });
        }

        function renderBooks() {
            booksGrid.innerHTML = '';
            
            let filteredBooks = books.filter(b => {
                // Status Filter
                if (activeFilters.status !== 'all' && b.status !== activeFilters.status) {
                    return false;
                }
                
                // Genre Filter
                if (activeFilters.genre !== 'all') {
                    const genres = b.genre ? b.genre.split(/[,，、/]/).map(g => g.trim()) : [];
                    if (!genres.includes(activeFilters.genre)) {
                        return false;
                    }
                }

                // Search Query Filter (Title, Author, Genre)
                if (activeFilters.search) {
                    const query = activeFilters.search.toLowerCase();
                    const titleMatch = b.title && b.title.toLowerCase().includes(query);
                    const authorMatch = b.author && b.author.toLowerCase().includes(query);
                    const genreMatch = b.genre && b.genre.toLowerCase().includes(query);
                    return titleMatch || authorMatch || genreMatch;
                }

                return true;
            });

            // Sort
            const sortVal = sortSelect.value;
            filteredBooks.sort((x, y) => {
                if (sortVal === 'added_desc') {
                    return new Date(y.added_date || 0) - new Date(x.added_date || 0);
                } else if (sortVal === 'added_asc') {
                    return new Date(x.added_date || 0) - new Date(y.added_date || 0);
                } else if (sortVal === 'read_desc') {
                    return new Date(y.read_date || 0) - new Date(x.read_date || 0);
                } else if (sortVal === 'read_asc') {
                    return new Date(x.read_date || 0) - new Date(y.read_date || 0);
                } else if (sortVal === 'title_asc') {
                    return (x.title || '').localeCompare(y.title || '', 'ja');
                } else if (sortVal === 'rating_desc') {
                    return (y.rating || 0) - (x.rating || 0);
                } else if (sortVal === 'rating_asc') {
                    return (x.rating || 0) - (y.rating || 0);
                }
                return 0;
            });

            if (filteredBooks.length === 0) {
                booksGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📚</div>
                        <p>表示する書籍が見つかりませんでした。</p>
                    </div>
                `;
                return;
            }

            filteredBooks.forEach(b => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.dataset.id = b.id;
                card.addEventListener('click', () => openEditModal(b.id));

                // Cover implementation
                let coverHtml = '';
                if (b.cover) {
                    coverHtml = `<img src="${b.cover}" class="cover-img" alt="${b.title}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">`;
                }
                
                // Placeholder fallback
                const placeholderHtml = `
                    <div class="cover-placeholder" style="${b.cover ? 'display:none;' : 'display:flex;'}">
                        <div class="cover-placeholder-icon">📖</div>
                        <div class="cover-placeholder-title">${b.title}</div>
                        <div class="cover-placeholder-author">${b.author || '著者不明'}</div>
                    </div>
                `;

                const statusLabel = b.status === 'read' ? '読了' : '気になる';
                const statusDate = b.status === 'read' ? (b.read_date || '') : (b.added_date || '');

                const authorName = b.author || '著者不明';
                const displayAuthor = b.author 
                    ? `<a href="#" class="card-author-link" data-author="${b.author}">${b.author}</a>` 
                    : '著者不明';

                let ratingHtml = '';
                if (b.rating && b.rating > 0) {
                    ratingHtml = `
                        <div class="card-rating" title="評価: ${b.rating} / 5">
                            ${'★'.repeat(b.rating)}${'☆'.repeat(5 - b.rating)}
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="cover-area">
                        ${coverHtml}
                        ${placeholderHtml}
                    </div>
                    <div class="card-info">
                        <div>
                            <div class="card-title">${b.title}</div>
                            <div class="card-author">${displayAuthor}</div>
                            ${ratingHtml}
                        </div>
                        <div class="card-meta">
                            <span class="status-badge ${b.status}">${statusLabel}</span>
                            <span class="card-date">${statusDate}</span>
                        </div>
                    </div>
                `;

                // Handle click on Author name link to trigger local filter
                const authorLink = card.querySelector('.card-author-link');
                if (authorLink) {
                    authorLink.addEventListener('click', (e) => {
                        e.stopPropagation(); // Stop opening edit modal
                        e.preventDefault();
                        const selectedAuthor = e.target.dataset.author;
                        if (selectedAuthor) {
                            searchInput.value = selectedAuthor;
                            activeFilters.search = selectedAuthor;
                            renderBooks();
                        }
                    });
                }

                booksGrid.appendChild(card);
            });
        }

        // --- Filtering Trigger Functions ---
        function filterByGenre(genre) {
            activeFilters.genre = genre;
            const badges = genreTagsContainer.querySelectorAll('.tag-badge');
            badges.forEach(b => {
                if (b.textContent === genre || (genre === 'all' && b.textContent === 'すべて')) {
                    b.classList.add('active');
                } else {
                    b.classList.remove('active');
                }
            });
            renderBooks();
        }

            bookGenre.value = '';

                    <div class="cover-placeholder-icon">📖</div>
                    <div class="cover-placeholder-title">${b.title}</div>
                </div>
            `;

            editModal.classList.remove('active');
        }

        // --- CRUD Logic & Cloud Syncing ---
        
        // Post        // Sync helper (Supabase is real-time, upsert local books if needed)
        async function syncWithGAS() {
            if (!supabaseClient) {
                initSupabase();
                if (!supabaseClient) return true;
            }

            try {
                if (books.length > 0) {
                    const { error } = await supabaseClient.from('books').upsert(books);
                    if (error) {
                        console.error("Supabase upsert error", error);
                        showToast("同期失敗: " + error.message, 'error');
                        return false;
                    }
                }
                showToast("Supabaseと同期完了", 'success');
                return true;
            } catch (e) {
                console.error("Supabase sync error", e);
                showToast("Supabase通信エラー", 'error');
                return false;
            }
        }
        const syncToCloud = syncWithGAS;

        // Pull full books array from Supabase (silent option for background sync)
        async function pullFromCloud(silent = false) {
            if (!supabaseClient) {
                initSupabase();
                if (!supabaseClient) return;
            }

            if (!silent) setLoader(true, "Supabaseから読込中...");
            try {
                const { data, error } = await supabaseClient
                    .from('books')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (!error && data) {
                    books = data;
                    saveLocalData();
                    renderBooks();
                    renderGenreTags();
                    renderChart();
                    if (!silent) showToast("最新データを読み込みました", 'success');
                } else if (error) {
                    console.error("Supabase pull error", error);
                    if (!silent) showToast("取得失敗: " + error.message, 'error');
                }
            } catch (e) {
                console.error("Cloud pull failed", e);
                if (!silent) showToast("通信エラーが発生しました", 'error');
            }
            if (!silent) setLoader(false);
        }

        // Trigger additions
        async function handleAddBook() {
            const title = bookTitle.value.trim();
            if (!title) {
                showToast("タイトルを入力してください", 'error');
                return;
            }

            const isRead = bookStatus.checked;
            const newBook = {
                id: 'book_' + Date.now(),
                title: title,
                author: bookAuthor.value.trim(),
                genre: bookGenre.value.trim(),
                cover: cleanImageUrl(bookCover.value),
                status: isRead ? 'read' : 'stock',
                added_date: bookAddedDate.value || getLocalDateString(),
                read_date: isRead ? bookReadDate.value : '',
                rating: isRead ? (parseInt(document.getElementById('book-rating').value) || 0) : 0
            };

            books.push(newBook);
            saveLocalData();
            
            const syncSuccess = await syncToCloud();
            if (syncSuccess) {
                closeAddModal();
                renderBooks();
                renderGenreTags();
                renderChart();
            }
        }

        // Trigger updates
        async function handleEditBook() {
            const id = editBookId.value;
            const bIndex = books.findIndex(item => item.id === id);
            if (bIndex === -1) return;

            const title = editBookTitle.value.trim();
            if (!title) {
                showToast("タイトルを入力してください", 'error');
                return;
            }

            const isRead = editBookStatus.checked;
            books[bIndex] = {
                id: id,
                title: title,
                author: editBookAuthor.value.trim(),
                genre: editBookGenre.value.trim(),
                cover: cleanImageUrl(editBookCover.value),
                status: isRead ? 'read' : 'stock',
                added_date: editBookAddedDate.value || getLocalDateString(),
                read_date: isRead ? editBookReadDate.value : '',
                rating: isRead ? (parseInt(document.getElementById('edit-book-rating').value) || 0) : 0
            };

            saveLocalData();
            const syncSuccess = await syncToCloud();
            if (syncSuccess) {
                closeEditModal();
                renderBooks();
                renderGenreTags();
                renderChart();
            }
        }

        // Trigger deletions
        async function handleDeleteBook() {
            const id = editBookId.value;
            const b = books.find(item => item.id === id);
            if (!b) return;

            if (confirm(`「${b.title}」を削除しますか？`)) {
                books = books.filter(item => item.id !== id);
                saveLocalData();
                if (supabaseClient) {
                    await supabaseClient.from('books').delete().eq('id', id);
                }
                closeEditModal();
                renderBooks();
                renderGenreTags();
                renderChart();
                showToast("削除しました", 'success');
            }
        }

        // --- JSON Backup / Restore Logic ---
        function exportToJson() {
            const dataStr = JSON.stringify(books, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = 'biblia_books_backup.json';
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
            showToast("バックアップJSONを出力しました");
        }

        function triggerImportJson() {
            document.getElementById('file-import').click();
        }

        function handleImportJson(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    const importedBooks = JSON.parse(evt.target.result);
                    if (Array.isArray(importedBooks)) {
                        if (confirm(`バックアップデータから ${importedBooks.length} 冊を復元しますか？（現在のデータは上書きされます）`)) {
                            books = importedBooks;
                            saveLocalData();
                            await syncToCloud();
                            renderBooks();
                            renderGenreTags();
                            showToast("データを復元しました", 'success');
                        }
                    } else {
                        showToast("無効なJSONフォーマットです", 'error');
                    }
                } catch (err) {
                    console.error(err);
                    showToast("JSONの読み込みに失敗しました", 'error');
                }
            };
            reader.readAsText(file);
        }

        // --- Rating Input Helper ---
        let setAddRating = null;
        let setEditRating = null;

        function initRatingInput(containerId, inputId, clearBtnId) {
            const container = document.getElementById(containerId);
            const input = document.getElementById(inputId);
            const clearBtn = document.getElementById(clearBtnId);
            const stars = container.querySelectorAll('.star');

            function updateStars(val) {
                input.value = val;
                stars.forEach(s => {
                    const starVal = parseInt(s.dataset.value);
                    if (starVal <= val) {
                        s.textContent = '★';
                        s.classList.add('active');
                    } else {
                        s.textContent = '☆';
                        s.classList.remove('active');
                    }
                });
                if (val > 0) {
                    clearBtn.style.display = 'inline-block';
                } else {
                    clearBtn.style.display = 'none';
                }
            }

            stars.forEach(s => {
                s.addEventListener('click', () => {
                    const val = parseInt(s.dataset.value);
                    updateStars(val);
                });
            });

            clearBtn.addEventListener('click', (e) => {
                e.preventDefault();
                updateStars(0);
            });

            return updateStars;
        }

        function registerEventListeners() {

                if (!url || !key) {
                    showToast("Supabase URLとAnon Keyを入力してください", 'error');

                        showToast("Supabase SDKが読み込まれていません", 'error');

                    const testClient = window.supabase.createClient(url, key);

                    if (!error) {
                        showToast("接続テスト成功！Supabaseと正常に通信できました", 'success');
                    } else {
                        showToast("接続失敗: " + error.message, 'error');
                    }
                } catch (e) {
                    console.error(e);
                    showToast("接続失敗: URLまたはキーの形式を確認してください", 'error');

                setLoader(false);

            // JSON actions
            document.getElementById('btn-export-json').addEventListener('click', exportToJson);
            document.getElementById('btn-import-json').addEventListener('click', triggerImportJson);
            document.getElementById('file-import').addEventListener('change', handleImportJson);

            // Add modal actions
            document.getElementById('btn-open-add').addEventListener('click', openAddModal);

            document.getElementById('btn-cancel-add').addEventListener('click', closeAddModal);
            document.getElementById('btn-submit-add').addEventListener('click', handleAddBook);

            // Keyword Search actions
            document.getElementById('btn-keyword-search').addEventListener('click', () => {
                triggerKeywordSearch(keywordInput.value);
            });
            keywordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    triggerKeywordSearch(keywordInput.value);
                }
            });
            loadMoreCandidatesBtn.addEventListener('click', () => {
                triggerKeywordSearch(currentKeyword, true);
            });

            // Scanning actions
            document.getElementById('btn-toggle-scan').addEventListener('click', startCameraScan);
            document.getElementById('btn-stop-scan').addEventListener('click', stopCameraScan);
            document.getElementById('btn-isbn-search').addEventListener('click', async () => {
                const isbn = isbnInput.value.trim();
                if (!isbn) {
                    showToast("ISBNを入力してください", 'error');
                    return;
                }
                await handleISBNSearch(isbn);
            });

            // Toggle dates and rating on status change (Add form)
            bookStatus.addEventListener('change', (e) => {
                const isRead = e.target.checked;
                readDateGroup.style.display = isRead ? 'block' : 'none';
                document.getElementById('book-rating-group').style.display = isRead ? 'block' : 'none';
            });

            // Edit modal actions
            document.getElementById('edit-modal-close').addEventListener('click', closeEditModal);
            document.getElementById('btn-cancel-edit').addEventListener('click', closeEditModal);
            document.getElementById('btn-submit-edit').addEventListener('click', handleEditBook);
            document.getElementById('btn-delete-book').addEventListener('click', handleDeleteBook);

            // Find other books by this author
            btnFindOtherBooks.addEventListener('click', (e) => {
                e.preventDefault();
                const author = editBookAuthor.value.trim();
                if (!author) return;

                closeEditModal();
                openAddModal();

                keywordInput.value = author;
                triggerKeywordSearch(author);
            });

            // Toggle dates and rating on status change (Edit form)
            editBookStatus.addEventListener('change', (e) => {
                const isRead = e.target.checked;
                editReadDateGroup.style.display = isRead ? 'block' : 'none';
                document.getElementById('edit-book-rating-group').style.display = isRead ? 'block' : 'none';
            });

            // Filtering UI
            document.querySelectorAll('.tag-badge[data-filter="status"]').forEach(badge => {
                badge.addEventListener('click', (e) => {
                    document.querySelectorAll('.tag-badge[data-filter="status"]').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    activeFilters.status = e.target.dataset.value;
                    renderBooks();
                });
            });

            searchInput.addEventListener('input', (e) => {
                activeFilters.search = e.target.value;
                renderBooks();
            });

            sortSelect.addEventListener('change', () => {
                renderBooks();
            });
        }

        // --- Chart Rendering ---
        let chartInstance = null;
        let chartMode = 'monthly'; // 'monthly' or 'yearly'

        function renderChart() {
            const readBooks = books.filter(b => b.status === 'read' && b.read_date);
            const totalRead = books.filter(b => b.status === 'read').length;
            const totalStock = books.filter(b => b.status === 'stock').length;

            // Update summary text
            document.getElementById('stats-summary').textContent =
                `読了 ${totalRead} 冊 ／ 気になる ${totalStock} 冊 ／ 合計 ${books.length} 冊`;

            const statsPanel = document.getElementById('stats-panel');
            const wrapper = document.getElementById('chart-wrapper');

            // 閉じた状態では描画をスキップして Chart.js の表示サイズエラーを防ぐ
            if (statsPanel && !statsPanel.classList.contains('open')) {
                return;
            }

            if (readBooks.length === 0) {
                if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
                wrapper.innerHTML = '<div class="stats-empty">📖 読了した本を登録するとグラフが表示されます</div>';
                return;
            }

            // Re-create canvas if destroyed
            if (!wrapper.querySelector('canvas')) {
                wrapper.innerHTML = '<canvas id="reads-chart"></canvas>';
            }

            // Build dataset
            const counts = {};
            readBooks.forEach(b => {
                const d = new Date(b.read_date);
                if (isNaN(d)) return;
                const key = chartMode === 'monthly'
                    ? `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}`
                    : `${d.getFullYear()}`;
                counts[key] = (counts[key] || 0) + 1;
            });

            const sortedKeys = Object.keys(counts).sort();
            const labels = sortedKeys;
            const data = sortedKeys.map(k => counts[k]);

            const ctx = document.getElementById('reads-chart').getContext('2d');

            if (chartInstance) { chartInstance.destroy(); }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: '読了冊数',
                        data,
                        backgroundColor: 'rgba(0, 240, 255, 0.25)',
                        borderColor: 'rgba(0, 240, 255, 0.85)',
                        borderWidth: 2,
                        borderRadius: 6,
                        borderSkipped: false,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#111115',
                            borderColor: '#262630',
                            borderWidth: 1,
                            titleColor: '#f3f4f6',
                            bodyColor: '#9ca3af',
                            callbacks: {
                                label: ctx => ` ${ctx.parsed.y} 冊`
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#9ca3af', font: { size: 11 } }
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: {
                                color: '#9ca3af',
                                font: { size: 11 },
                                stepSize: 1,
                                precision: 0
                            },
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // --- App Entry Point ---
        window.addEventListener('DOMContentLoaded', async () => {
            loadLocalStorage();
            registerEventListeners();

            // Chart toggle buttons
            document.getElementById('btn-chart-monthly').addEventListener('click', () => {
                chartMode = 'monthly';
                document.getElementById('btn-chart-monthly').classList.add('active');
                document.getElementById('btn-chart-yearly').classList.remove('active');
                renderChart();
            });
            document.getElementById('btn-chart-yearly').addEventListener('click', () => {
                chartMode = 'yearly';
                document.getElementById('btn-chart-yearly').classList.add('active');
                document.getElementById('btn-chart-monthly').classList.remove('active');
                renderChart();
            });

            renderBooks();
            renderGenreTags();
            renderChart();

            if (syncSettings.url) {
                await pullFromCloud();
                renderChart();
            }
        });
    </script>
</body>
</html>
